name: Quality

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  build-macos-dmg:
    name: Build macOS DMG
    needs: test-and-lint
    # Only this job may write: it creates/updates the GitHub Release for v* tags.
    permissions:
      contents: write
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version v$version. Bump the version or fix the tag."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG (arm64, unsigned)
        # No Developer ID certificate is provisioned in CI, so identity
        # auto-discovery is disabled: the DMG is unsigned/not notarized
        # and Gatekeeper will warn on first launch.
        # GH_TOKEN is deliberately NOT set here: with a token present,
        # electron-builder auto-publishes a draft Release on tag builds.
        # Publishing is handled explicitly by the step below instead.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: conductor-macos-dmg
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14

      # Pushing a v* tag (e.g. v0.1.0, matching package.json) also publishes
      # the DMG as a permanent GitHub Release asset. Regular pushes to main
      # only produce the 14-day Actions artifact above.
      - name: Publish DMG to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.dmg \
              --title "Conductor $GITHUB_REF_NAME" \
              --generate-notes
          fi
          # Guarantee the Release is visible, not left as a draft.
          gh release edit "$GITHUB_REF_NAME" \
            --title "Conductor $GITHUB_REF_NAME" --draft=false
